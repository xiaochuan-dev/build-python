name: Build Python 3.12.14

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout CPython
        uses: actions/checkout@v5
        with:
          repository: python/cpython
          ref: v3.12.14
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check CPython version
        shell: cmd
        run: |
          git describe --tags --always
          git log -1 --oneline

      - name: Build Python
        shell: cmd
        run: |
          cd PCbuild
          build.bat -p x64 -c Debug "/p:PlatformToolset=v145"

      - name: Test Python
        shell: cmd
        run: |
          PCbuild\amd64\python.exe --version
          PCbuild\amd64\python.exe -c "import sys; print(sys.executable); print(sys.version)"

      - name: Upload Python
        uses: actions/upload-artifact@v4
        with:
          name: python-3.12.14-windows-x64
          path: PCbuild/amd64/